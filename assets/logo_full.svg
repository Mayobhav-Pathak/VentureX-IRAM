<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 110" width="100%" height="100%">
  <defs>
    <linearGradient id="loopTrackGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- INTERLOCKING LOOP EMBLEM -->
  <g transform="translate(10, 8)">
    <!-- Base Glow Track -->
    <path d="M 50,52 C 34,22 10,24 10,52 C 10,80 34,82 50,52 C 66,22 90,24 90,52 C 90,80 66,82 50,52 Z" 
          fill="none" stroke="#f1f5f9" stroke-width="12" stroke-linecap="round"/>

    <!-- Dynamic Continuous Dual Rail -->
    <path d="M 50,52 C 34,22 10,24 10,52 C 10,80 34,82 50,52 C 66,22 90,24 90,52 C 90,80 66,82 50,52 Z" 
          fill="none" stroke="url(#loopTrackGrad)" stroke-width="5" stroke-linecap="round"/>

    <!-- Dashed Center Alignment / Ties -->
    <path d="M 50,52 C 34,22 10,24 10,52 C 10,80 34,82 50,52 C 66,22 90,24 90,52 C 90,80 66,82 50,52 Z" 
          fill="none" stroke="#ffffff" stroke-width="1.6" stroke-dasharray="3 4"/>

    <!-- Department Synergy Nodes (ENG / SNT / TRD) -->
    <!-- ENG Node (Blue) -->
    <circle cx="10" cy="52" r="5.5" fill="#0284c7" stroke="#ffffff" stroke-width="2"/>
    <!-- TRD Node (Purple) -->
    <circle cx="50" cy="52" r="6" fill="#6366f1" stroke="#ffffff" stroke-width="2"/>
    <!-- SNT Node (Amber) -->
    <circle cx="90" cy="52" r="5.5" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- TYPOGRAPHY -->
  <g transform="translate(125, 10)">
    <text x="0" y="48" font-family="'Segoe UI', Roboto, 'Rajdhani', sans-serif" font-weight="900" font-size="44" fill="#0f172a" letter-spacing="2.5">
      IR<tspan fill="#6366f1">·</tspan><tspan fill="#0284c7">RAMS</tspan>
    </text>

    <!-- Modern Sans Subtitle -->
    <text x="2" y="70" font-family="'Segoe UI', Roboto, 'Barlow', sans-serif" font-weight="700" font-size="7" fill="#475569" letter-spacing="2.2">
      INDIAN RAILWAYS - RAILWAYS ASSET MANAGEMENT SYSTEM
    </text>
    
    <!-- System Role -->
    <text x="2" y="86" font-family="'Segoe UI', Roboto, 'Barlow', sans-serif" font-weight="600" font-size="10.5" fill="#6366f1" letter-spacing="1.5">
      Synchronizing Possessions, Maximizing Throughput 
    </text>

    <!-- Multi-Department Barometer -->
    <g transform="translate(2, 94)">
      <rect x="0" y="0" width="80" height="3" fill="#0284c7" rx="1.5"/>  <!-- ENG -->
      <rect x="85" y="0" width="80" height="3" fill="#f59e0b" rx="1.5"/> <!-- SNT -->
      <rect x="170" y="0" width="80" height="3" fill="#6366f1" rx="1.5"/> <!-- TRD -->
    </g>
  </g>
</svg>
