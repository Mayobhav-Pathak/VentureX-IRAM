<svg xmlns="http://www.w3.org/2000/svg" viewBox="13.5 32.24 93 55.51">
  <defs>
    <linearGradient id="loopTrackGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- INTERLOCKING LOOP EMBLEM -->
  <g transform="translate(10, 8)">
    <!-- Base Glow Track -->
    <path d="M 50,52 C 34,22 10,24 10,52 C 10,80 34,82 50,52 C 66,22 90,24 90,52 C 90,80 66,82 50,52 Z" fill="none" stroke="#f1f5f9" stroke-width="12" stroke-linecap="round"/>

    <!-- Dynamic Continuous Dual Rail -->
    <path d="M 50,52 C 34,22 10,24 10,52 C 10,80 34,82 50,52 C 66,22 90,24 90,52 C 90,80 66,82 50,52 Z" fill="none" stroke="url(#loopTrackGrad)" stroke-width="5" stroke-linecap="round"/>

    <!-- Dashed Center Alignment / Ties -->
    <path d="M 50,52 C 34,22 10,24 10,52 C 10,80 34,82 50,52 C 66,22 90,24 90,52 C 90,80 66,82 50,52 Z" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-dasharray="3 4"/>

    <!-- Department Synergy Nodes (ENG / SNT / TRD) -->
    <!-- ENG Node (Blue) -->
    <circle cx="10" cy="52" r="5.5" fill="#0284c7" stroke="#ffffff" stroke-width="2"/>
    <!-- TRD Node (Purple) -->
    <circle cx="50" cy="52" r="6" fill="#6366f1" stroke="#ffffff" stroke-width="2"/>
    <!-- SNT Node (Amber) -->
    <circle cx="90" cy="52" r="5.5" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
  </g>


</svg>